name: Job Radar – Fresh

# On demand: ask Greenhouse, Lever and Ashby directly for jobs posted in the
# last 24 hours and publish them to /fresh.html (newest first, minutes ago).
# Only checks companies that already appear in the Job Radar feed, plus
# fresh.extra_companies in dashboard/config.json.
#
# Run it from Actions → "Job Radar – Fresh" → Run workflow (works from the
# GitHub mobile app too). Takes ~5–10 minutes including GitHub's queue.

on:
  push:  # TEMP-BRANCH-TEST: remove before merging
    branches: [job-radar-fresh]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check and summarise without publishing
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with the daily build so the two never publish over each other;
# later runs wait instead of cancelling a run that's in progress.
concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # The repo's own Greenhouse / Lever / Ashby scrapers (base install + bs4).
        run: pip install -e . beautifulsoup4 pyarrow pytest

      - name: Test
        run: python -m pytest dashboard/test_fresh_jobs.py dashboard/test_build_jobs.py -q -p no:cacheprovider -o addopts=""

      - id: pages
        uses: actions/configure-pages@v5

      - name: Pull the published feed
        run: >
          python dashboard/pull_live.py "${{ steps.pages.outputs.base_url }}/data" dashboard/site/data
          --feed --app-version "${{ github.sha }}"

      - name: Check job boards for fresh postings
        run: >
          python dashboard/fresh_jobs.py --feed dashboard/site/data --out dashboard/site/data/fresh.json
          --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/workflows/job-radar-fresh.yml"

      - name: Stamp page version
        run: sed -i 's/__APP_VERSION__/${{ github.sha }}/' dashboard/site/index.html

      - name: Summarise
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          d = json.load(open("dashboard/site/data/fresh.json"))
          now = datetime.now(timezone.utc)
          def within(h):
              cut = (now - timedelta(hours=h)).isoformat(timespec="minutes").replace("+00:00", "Z")
              return sum(1 for j in d["jobs"] if j["posted_ts"] >= cut)
          lines = [f"checked {d['companies_checked']} ({d['companies_failed']} failed) in {d['seconds']}s, "
                   f"{d['postings_seen']} postings",
                   "fresh: " + ", ".join(f"{h}h {within(h)}" for h in (1, 3, 6, 24))]
          lines += [f"{j['posted_ts'][11:16]}Z  {j['company']} · {j['title']} · {j['location']}" for j in d["jobs"][:15]]
          print("::notice title=Fresh jobs::" + "%0A".join(lines)[:3900])
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/site

  deploy:
    needs: build
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

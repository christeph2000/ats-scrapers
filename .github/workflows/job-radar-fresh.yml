name: Job Radar – Fresh

# On demand: ask the job boards directly (Greenhouse, Lever, Ashby,
# SmartRecruiters, Recruitee, Workable, Keka, Darwinbox) for jobs posted in the
# last 24 hours and publish them to /fresh.html (newest first, minutes ago).
# Which companies: see the "fresh" section of dashboard/config.json.
#
# Run it from Actions → "Job Radar – Fresh" → Run workflow (works from the
# GitHub mobile app too). Takes ~5–10 minutes including GitHub's queue.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check and summarise without publishing
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with the daily build so the two never publish over each other;
# later runs wait instead of cancelling a run that's in progress.
concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # The repo's own scrapers (base install + bs4); httpcloak is the
        # TLS-impersonating client Darwinbox's Cloudflare front needs.
        run: |
          pip install -e . beautifulsoup4 pyarrow pytest
          pip install httpcloak || echo "::warning::httpcloak unavailable; Darwinbox boards will fail"

      - name: Test
        run: python -m pytest dashboard/test_fresh_jobs.py dashboard/test_build_jobs.py -q -p no:cacheprovider -o addopts=""

      - id: pages
        uses: actions/configure-pages@v5

      - name: Pull the published feed
        run: >
          python dashboard/pull_live.py "${{ steps.pages.outputs.base_url }}/data" dashboard/site/data
          --feed --fresh --app-version "${{ github.sha }}"

      - name: Check job boards for fresh postings
        run: >
          python dashboard/fresh_jobs.py --feed dashboard/site/data --out dashboard/site/data/fresh.json
          --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/workflows/job-radar-fresh.yml"

      - name: Stamp page version
        run: sed -i 's/__APP_VERSION__/${{ github.sha }}/' dashboard/site/index.html

      - name: Summarise
        run: |
          python - <<'PY'
          import json
          d = json.load(open("dashboard/site/data/fresh.json"))
          fmt = lambda c: " · ".join(f"{k} {v}" for k, v in c.items())
          lines = [f"checked {sum(d['companies_checked'].values())} companies in {d['seconds']}s, "
                   f"{d['postings_seen']} postings; failed {d['failed_by_ats'] or 0}",
                   "companies by platform: " + fmt(d["companies_checked"]),
                   "companies by origin: " + fmt(d["companies_by_origin"]),
                   "FRESH JOBS: " + fmt(d["counts"])]
          lines += [f"  from {o}: " + fmt(c) for o, c in d["counts_by_origin"].items()]
          lines += [f"  on {a}: " + fmt(c) for a, c in d["counts_by_ats"].items()]
          print("::notice title=Fresh jobs::" + "%0A".join(lines)[:3900])
          top = [f"{j['posted_ts'][11:16]}Z {'~' if j.get('approx') else ' '} {j['company']} · {j['title']} · {j['location']} [{j['origin']}]"
                 for j in d["jobs"][:25]]
          print("::notice title=Newest::" + "%0A".join(top)[:3900])
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/site

  deploy:
    needs: build
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

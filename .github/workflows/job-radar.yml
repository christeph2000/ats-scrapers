name: Job Radar

# Builds the Job Radar feed twice a day:
#   1. pulls the hosted ats-scrapers dataset slices listed in dashboard/config.json
#   2. keeps engineering roles in India / remote-from-India / abroad with visa support
#   3. publishes dashboard/site (page + data/index.json, data/roles/*.json, data/seen.json)
# Each visitor picks their roles and city on the page; that stays in their browser.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  schedule:
    # The hosted dataset is rebuilt once a day around 20:00 IST (14:30 UTC).
    - cron: "7 16 * * *" # 21:37 IST: pick up that day's snapshot
    - cron: "17 1 * * *" # 06:47 IST: catch-up in case the snapshot ran late
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and summarise the feed without publishing
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/job-radar.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: job-radar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx pyarrow pytest

      - name: Test filters
        run: python -m pytest dashboard/test_build_jobs.py -q -p no:cacheprovider -o addopts=""

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build jobs feed
        run: >
          python dashboard/build_jobs.py
          --previous "${{ steps.pages.outputs.base_url }}/data"
          --app-version "${{ github.sha }}"

      - name: Stamp page version
        # Lets phones that cached an older page notice the new one and reload.
        run: sed -i 's/__APP_VERSION__/${{ github.sha }}/' dashboard/site/index.html

      - name: Summarise feed
        run: |
          python - <<'PY'
          import json
          d = json.load(open("dashboard/site/data/index.json"))
          def note(title, lines, level="notice"):
              print(f"::{level} title={title}::" + "%0A".join(lines)[:3900])
          note("Feed", [f"total {d['total']}, new this run {d['new_in_run']}",
                        f"places {d['places']}", f"failed sources {d['failed_sources']}",
                        "roles " + ", ".join(f"{k} {v['count']}" for k, v in d["roles"].items()),
                        "cities " + ", ".join(f"{k} {v}" for k, v in list(d["cities"].items())[:12])])
          steps = ["rows", "title_hint", "role_match", "recent", "kept"]
          rows = sorted(d["funnel"].items(), key=lambda kv: -kv[1]["kept"])
          note("Per source (rows > title hint > role > recent > kept)",
               [f"{s}: " + " > ".join(str(f[k]) for k in steps) for s, f in rows])
          empty = [s for s, f in rows if f["rows"] > 1000 and f["kept"] == 0]
          if empty:
              note("Sources with no matches", empty, "warning")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/site

  deploy:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

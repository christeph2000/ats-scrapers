name: Job Radar

# Builds the personal job dashboard once a day:
#   1. pulls the hosted ats-scrapers dataset slices listed in dashboard/config.json
#   2. keeps roles matching dashboard/config.json
#   3. publishes dashboard/site (page + data/jobs.json) to GitHub Pages
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  schedule:
    # The hosted dataset is rebuilt once a day around 20:00 IST (14:30 UTC).
    - cron: "7 16 * * *" # 21:37 IST: pick up that day's snapshot
    - cron: "17 1 * * *" # 06:47 IST: catch-up in case the snapshot ran late
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and summarise the feed without publishing
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/job-radar.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: job-radar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx pyarrow pytest

      - name: Test filters
        run: python -m pytest dashboard/test_build_jobs.py -q -p no:cacheprovider -o addopts=""

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build jobs feed
        run: >
          python dashboard/build_jobs.py
          --previous "${{ steps.pages.outputs.base_url }}/data/jobs.json"

      - name: Summarise feed
        run: |
          python - <<'PY'
          import collections, json
          d = json.load(open("dashboard/site/data/jobs.json"))
          j = d["jobs"]
          def note(title, lines):
              print(f"::notice title={title}::" + "%0A".join(lines)[:3900])
          note("Feed", [f"total {d['total']}, new {d['new_today']}", f"places {d['places']}",
                        f"failed sources {d['failed_sources']}",
                        "support " + str(collections.Counter(s for x in j for s in x["support"]))])
          note("Per source", [f"{k}: {v}" for k, v in sorted(d["counts"].items(), key=lambda kv: -kv[1])])
          for place in ("remote", "abroad"):
              c = collections.Counter(x["location"] for x in j if x["place"] == place)
              note(f"Top {place} locations", [f"{n} | {l}" for l, n in c.most_common(40)])
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/site

  deploy:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

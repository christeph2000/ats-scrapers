<!doctype html><html><head><meta charset="utf-8"><title>Acme - Software Engineer II</title></head>
<body><div class="posting-headline"><h2>Software Engineer II</h2></div>
<form method="POST" id="application-form"><ul>
 <li class="application-question"><label><div class="application-label">Resume/CV<span class="required">✱</span></div>
   <div class="application-field"><input type="file" name="resume" id="resume-upload-input"></div></label></li>
 <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div><div class="application-field"><input type="text" name="name" required></div></label></li>
 <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div><div class="application-field"><input type="email" name="email" required></div></label></li>
 <li class="application-question"><label><div class="application-label">Phone</div><div class="application-field"><input type="text" name="phone"></div></label></li>
 <li class="application-question"><label><div class="application-label">Current company</div><div class="application-field"><input type="text" name="org"></div></label></li>
 <li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
 <li class="application-question"><label><div class="application-label">GitHub URL</div><div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
 <li class="application-question custom-question"><div class="application-label">Are you willing to relocate to Bengaluru?<span class="required">✱</span></div>
   <div class="application-field"><ul>
     <li><label><input type="radio" name="cards[abc][field0]" value="Yes"> Yes</label></li>
     <li><label><input type="radio" name="cards[abc][field0]" value="No"> No</label></li></ul></div></li>
 <li class="application-question custom-question"><div class="application-label">Which of these have you used in production?</div>
   <div class="application-field"><ul>
     <li><label><input type="checkbox" name="cards[abc][field1]" value="Kafka"> Kafka</label></li>
     <li><label><input type="checkbox" name="cards[abc][field1]" value="Spark"> Spark</label></li>
     <li><label><input type="checkbox" name="cards[abc][field1]" value="Kubernetes"> Kubernetes</label></li></ul></div></li>
 <li class="application-question custom-question"><label><div class="application-label">Current CTC (in LPA)</div><div class="application-field"><input type="text" name="cards[abc][field2]"></div></label></li>
 <li class="application-question custom-question"><label><div class="application-label">Years of experience with Java<span class="required">✱</span></div><div class="application-field"><input type="text" name="cards[abc][field3]" required></div></label></li>
</ul><button type="submit" class="template-btn-submit">Submit application</button></form>
<script>document.getElementById('application-form').addEventListener('submit',e=>{e.preventDefault();document.body.dataset.submitted='1'});</script>
</body></html>
